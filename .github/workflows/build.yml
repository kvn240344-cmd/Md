name: Build KEVEN Messenger V4 REAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Extraer KEVEN Messenger V4 REAL
        run: |
          rm -rf keven_project
          mkdir -p keven_project
          unzip -o KEVEN_MESSENGER_V4_REAL.zip -d keven_project
          echo "Contenido extraído:"
          find keven_project -maxdepth 3 -type f | sort

      - name: Compilar APK V4 REAL
        working-directory: keven_project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Guardar APK nuevo
        uses: actions/upload-artifact@v4
        with:
          name: KEVEN-Messenger-V4-REAL-APK
          path: keven_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
